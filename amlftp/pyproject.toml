[project]
name = "amlftp"
version = "0.1.0"
description = "Multimodal image-text classification with cross-attention"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "datasets>=3.0",
    "gradio>=6.9.0",
    "matplotlib>=3.10",
    "numpy>=2",
    "pillow>=10",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "weights", "reports"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "C4", "ICN", "RET", "SIM"]
ignore = ["E741", "RET504"]

[tool.ruff.lint.isort]
known-first-party = ["amlftp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
